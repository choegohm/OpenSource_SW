apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ws-{{ .Release.Name }}
  namespace: workspaces
  annotations:
    dapr.io/enabled: "true"
    dapr.io/app-id: "ws-{{ .Release.Name }}"
    dapr.io/app-port: "8080"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/scale-to-zero-pod-retention-period: "{{ .Values.knative.idleTimeout }}"
    spec:
      containers:
        - image: codercom/code-server:latest
          command: ["/bin/bash", "-c"]
          args:
            - |
              {{- if .Values.packages }}
              echo "패키지 설치 중..."
              sudo apt-get update -qq && sudo apt-get install -y python3 python3-pip -qq
              pip3 install --break-system-packages {{ join " " .Values.packages }}
              {{- end }}
              exec /usr/bin/entrypoint.sh --bind-addr 0.0.0.0:8080 /home/coder/workspace
          env:
            - name: PASSWORD
              value: "devspace1234"
          resources:
            requests:
              cpu: {{ .Values.cpu }}
              memory: {{ .Values.memory }}
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: workspace-data
              mountPath: /home/coder/workspace
      volumes:
        - name: workspace-data
          persistentVolumeClaim:
            claimName: ws-{{ .Release.Name }}-data