apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: workspace-pubsub
  namespace: workspaces
spec:
  type: pubsub.redis
  version: v1
  metadata:
  - name: redisHost
    value: "redis-master.workspaces.svc:6379"
---
apiVersion: dapr.io/v1alpha1
kind: Subscription
metadata:
  name: workspace-terminated
  namespace: workspaces
spec:
  topic: workspace.terminated
  route: /cleanup
  pubsubname: workspace-pubsub
